<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Curso</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./estilos/style.css" />
  </head>
  <body>
    <nav id="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid d-flex justify-content-between">
        <div id="divTopo">
          <a class="navbar-brand d-flex align-items-center" href="./index.html">
            <img
              src="../assets/online-learning.png"
              style="width: 45px"
              alt="brand do site Aquicurso"
            />
            <span class="brand ms-2">AquiCursos</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarSupportedContent"
        >
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item me-2">
              <div class="dropdown">
                <a
                  class="nav-link"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Cadastrar
                </a>

                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="./cadastroCurso.html"
                      >Curso</a
                    >
                  </li>
                  <li><a class="dropdown-item" href="#">Docente</a></li>
                  <li>
                    <a class="dropdown-item" href="#">Relatórios</a>
                  </li>
                </ul>
              </div>
            </li>
            <li class="nav-item me-2">
              <a class="nav-link" href="#">Perfil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link me-4" id="loginLink" href="./login.html"
                ><img
                  src="./assets/logout.png"
                  class="me-2"
                  style="width: 20px"
                  alt="login-avatar"
                  id="iconLogout"
                /><span>Sair</span></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div id="hero-menu">
      <form id="formCliente" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="nomeCurso" class="form-label">Nome do Curso:</label>
          <input
            type="text"
            class="form-control"
            id="nomeCurso"
            placeholder="Curso Básico de Python"
            required
          />
        </div>
        <div class="invalid-feedback">Insira o nome do curso.</div>
        <div class="col-md-2">
          <label for="sigla" class="form-label">Sigla:</label>
          <input
            type="text"
            class="form-control"
            id="sigla"
            placeholder="CBP"
            required
            maxlength="5"
          />
        </div>
        <div class="col-md-2">
          <label for="formDate" class="form-label">Data de início:</label>
          <input
            id="dataInicio"
            type="date"
            class="form-control"
            maxlength="15"
            aria-label="Data de inicio de curso"
            required
          />
          <div class="invalid-feedback">Digite uma data válida.</div>
        </div>
        <div class="col-md-2">
          <label for="formDate" class="form-label">Data de fim:</label>
          <input
            id="dataFim"
            type="date"
            class="form-control"
            maxlength="15"
            aria-label="Data de fim de curso"
            required
          />
          <div class="invalid-feedback">Digite uma data válida.</div>
        </div>
        <div class="col-md-12">
          <label for="conteudo" class="form-label"
            >Conteúdo Programático:</label
          >
          <textarea
            name="conteudo"
            id="conteudoProg"
            class="form-control"
            cols="30"
            rows="10"
            required
          ></textarea>
        </div>
        <div class="col-md-3">
          <label for="codigo" class="form-label">Código:</label>
          <input
            type="text"
            class="form-control"
            id="codigo"
            placeholder="1111"
            required
            maxlength="8"
          />
        </div>
        <div class="col-md-3">
          <label for="validationCustom04" class="form-label">Docente:</label>
          <select class="form-select" id="docente" required>
            <option selected disabled placeholder="">Selecione...</option>
          </select>
          <div class="invalid-feedback">
            Por favor selecione uma opção de docente.
          </div>
        </div>
        <div class="col-md-3">
          <label for="validationCustom05" class="form-label"
            >Carga Horária</label
          >
          <input
            type="number"
            class="form-control"
            id="cargaHoraria"
            required
            placeholder="120"
            max="999"
          />
          <div class="invalid-feedback">Insira a carga horária</div>
        </div>
        <div class="col-md-3">
          <label for="validationCustom05" class="form-label">Valor:</label>
          <input
            id="valor"
            type="number"
            class="form-control"
            name="quantity"
            step="0.01"
            min="0.01"
            required
          />
        </div>
        <div class="invalid-feedback">Insira um valor</div>
        <div class="col-12">
          <button id="btnCadastrar" class="btn btn-primary" type="submit">
            Cadastrar
          </button>
          <button id="btnAtualizar" class="btn btn-secondary" type="button">
            Atualizar
          </button>
          <button id="btnReset" class="btn btn-secondary" type="button">
            Reset
          </button>
        </div>
      </form>
      <div id="mensagem"></div>
    </div>
    <div id="tabela" class="mb-3 container-fluid"></div>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script src="/js/curso.js"></script>
</html>
